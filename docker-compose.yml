# 프로젝트명을 실행 디렉터리에서 떼어 고정한다. 이게 없으면 worktree에서
# `docker compose up`을 할 때 디렉터리명(`.wt/<subject>`)이 프로젝트명이 되어
# 별도 볼륨과 컨테이너가 생기고, 아래 포트를 메인 repo 것과 다투게 된다.
# 먼저 뜬 쪽이 포트를 갖기 때문에 어느 DB에 붙었는지 알 수 없어진다.
name: cheongyak-rag

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cheongyak-db
    environment:
      POSTGRES_USER: cheongyak
      POSTGRES_PASSWORD: cheongyak
      POSTGRES_DB: cheongyak
    # 호스트에 이미 Postgres 가 5432 를 점유 중이라 5433 으로 매핑한다.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheongyak -d cheongyak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
